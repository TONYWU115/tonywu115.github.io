<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TONY</title>
    <link rel="website icon" href="./image/web_icon.png">
    <style>
        :root{
            --accent: #ffffff;
            --muted: rgba(255,255,255,0.8);
            --glass-bg: rgba(255,255,255,0.06);
        }
        html,body {
            height: 100%;
            margin: 0;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background: radial-gradient(circle, #1a1a2e, #16213e);
            color: var(--accent);
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
        }
        canvas {
            position: fixed;
            inset: 0;
            display: block;
            z-index: 0;
        }
        .overlay {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
            box-sizing: border-box;
        }
        .card {
            width: 100%;
            max-width: 820px;
            background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
            border-radius: 12px;
            padding: 36px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.04);
            backdrop-filter: blur(6px) saturate(120%);
        }
        h1 {
            margin: 0 0 8px 0;
            font-size: 40px;
            letter-spacing: 1px;
        }
        p.lead {
            margin: 0 0 20px 0;
            color: var(--muted);
        }
        .links {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .link-btn {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            padding: 10px 14px;
            border-radius: 10px;
            color: var(--accent);
            text-decoration: none;
            background: var(--glass-bg);
            border: 1px solid rgba(255,255,255,0.06);
            transition: transform .12s ease, background .12s ease, box-shadow .12s ease;
            font-weight: 600;
            font-size: 14px;
        }
        .link-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            background: rgba(255,255,255,0.04);
            color: #222; /* 新增：滑鼠移上時字變黑色 */
        }
        .icon {
            width: 18px;
            height: 18px;
            display: inline-block;
            fill: currentColor;
            opacity: .95;
        }
        @media (max-width:520px){
            h1 { font-size: 28px; }
            .card { padding: 20px; }
            .link-btn { padding: 8px 10px; font-size:13px; }
        }
    </style>
</head>
<body>
    <canvas id="netCanvas" aria-hidden="true"></canvas>

    <main class="overlay" role="main">
        <section class="card" aria-labelledby="title">
            <h1 id="title">TONY</h1>
            <p class="lead" id="nowTime"></p>

            <div class="links" aria-label="社群連結">
                <a class="link-btn" href="https://github.com/TONYWU115" target="_blank" rel="noopener" aria-label="GitHub">
                    <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M12 .5C5.73.5.75 5.48.75 11.75c0 4.88 3.16 9.02 7.55 10.48.55.1.75-.24.75-.53 0-.26-.01-1.13-.02-2.05-3.07.67-3.72-1.48-3.72-1.48-.5-1.28-1.22-1.62-1.22-1.62-.99-.68.08-.67.08-.67 1.09.08 1.66 1.12 1.66 1.12.97 1.66 2.55 1.18 3.17.9.1-.7.38-1.18.69-1.45-2.45-.28-5.02-1.22-5.02-5.43 0-1.2.43-2.18 1.12-2.95-.11-.28-.49-1.4.11-2.92 0 0 .91-.29 2.98 1.13a10.3 10.3 0 0 1 2.71-.36c.92 0 1.85.12 2.71.36 2.07-1.42 2.98-1.13 2.98-1.13.6 1.52.22 2.64.11 2.92.7.77 1.12 1.75 1.12 2.95 0 4.22-2.58 5.14-5.04 5.41.39.34.73 1.01.73 2.05 0 1.48-.01 2.67-.01 3.03 0 .29.2.63.76.52 4.39-1.46 7.55-5.6 7.55-10.48C23.25 5.48 18.27.5 12 .5z"/>
                    </svg>
                    GitHub
                </a>

                <a class="link-btn" href="https://www.instagram.com/yan.93.01/" target="_blank" rel="noopener" aria-label="Instagram">
                    <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm5 6.1A4.9 4.9 0 1 0 16.9 13 4.9 4.9 0 0 0 12 8.1zm6.4-2.7a1.2 1.2 0 1 1-1.2-1.2 1.2 1.2 0 0 1 1.2 1.2zM12 9.5A3.5 3.5 0 1 1 8.5 13 3.5 3.5 0 0 1 12 9.5z"/>
                    </svg>
                    Instagram
                </a>
            </div>
        </section>
    </main>

    <script>

        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleString('zh-TW', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('nowTime').textContent = timeStr;
        }
        updateTime();
        setInterval(updateTime, 1000);

        const canvas = document.getElementById("netCanvas");
        const ctx = canvas.getContext("2d");
        const numPoints = 20;  // 橫向與縱向的點數
        const points = [];
        const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            resetPoints();
        }

        class Point {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.originX = x;
                this.originY = y;
                this.size = 3;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255,255,255,0.95)";
                ctx.fill();
            }
            update() {
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.max(1, Math.sqrt(dx * dx + dy * dy));
                const force = Math.min(220 / dist, 8);
                const angle = Math.atan2(dy, dx);
                this.x += Math.cos(angle) * force;
                this.y += Math.sin(angle) * force;
                this.x += (this.originX - this.x) * 0.05;
                this.y += (this.originY - this.y) * 0.05;
                this.draw();
            }
        }

        function resetPoints() {
            points.length = 0;
            const stepX = window.innerWidth / (numPoints + 1);
            const stepY = window.innerHeight / (numPoints + 1);
            for (let i = 1; i <= numPoints; i++) {
                for (let j = 1; j <= numPoints; j++) {
                    const x = i * stepX;
                    const y = j * stepY;
                    points.push(new Point(x, y));
                }
            }
        }

        function connectPoints() {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
            ctx.lineWidth = 1;
            for (let i = 0; i < points.length; i++) {
                for (let j = i + 1; j < points.length; j++) {
                    const dx = points[i].x - points[j].x;
                    const dy = points[i].y - points[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 100) {
                        ctx.beginPath();
                        ctx.moveTo(points[i].x, points[i].y);
                        ctx.lineTo(points[j].x, points[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            points.forEach((point) => point.update());
            connectPoints();
            requestAnimationFrame(animate);
        }

        window.addEventListener("mousemove", (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener("touchmove", (e) => {
            if (e.touches && e.touches[0]) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        }, {passive:true});

        function explode() {
            points.forEach((point) => {
                point.x += Math.random() * 50 - 25;
                point.y += Math.random() * 50 - 25;
            });
        }
        window.addEventListener("click", (e) => {
            if (e.target && e.target.closest && e.target.closest('.link-btn')) return;
            explode();
        });
        window.addEventListener("touchstart", (e) => {
            const target = e.target;
            if (target && target.closest && target.closest('.link-btn')) return;
            explode();
        }, { passive: true });

        window.addEventListener("resize", resizeCanvas);

        resizeCanvas();
        animate();
    </script>
</body>
</html>
