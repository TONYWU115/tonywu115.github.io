<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TONY</title>
    <link rel="website icon" href="./image/web_icon.png">
    <!-- Font Awesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <style>
        :root{
            --accent: #ff4b4b;
            --muted: rgba(255,255,255,0.8);
            --glass-bg: rgba(0,0,0,0.75);
        }
        html {
            min-height: 100%;
            background: #000;
            overscroll-behavior-y: none;
        }

        body {
            min-height: 100dvh;
            margin: 0;
            /* font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; */
            font-family: Consolas,Menlo;
            background: radial-gradient(
                circle at top,
                #3b0000 0%,
                #050000 55%,
                #000000 100%
            );
            overscroll-behavior-y: none;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100dvh;
        }
        .overlay {
            position: relative;
            z-index: 2;
            /* min-height: 100vh; */
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
            box-sizing: border-box;
        }
        .card {
            width: 100%;
            max-width: 700px;
            background: linear-gradient(180deg, rgba(0,0,0,0.9), rgba(0,0,0,0.96));
            border-radius: 12px;
            padding: 36px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0,0,0,0.9);
            border: 1px solid rgba(255,0,0,0.4);
            backdrop-filter: blur(6px) saturate(120%);
        }
        h1 {
            margin: 0 0 8px 0;
            font-size: 40px;
            letter-spacing: 1px;
            color: var(--accent);
        }
        p.lead {
            margin: 0 0 20px 0;
            color: var(--muted);
        }
        .links {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .link-btn {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            padding: 10px 16px;
            border-radius: 10px;
            /* color: #f5f5f5; */
            color: antiquewhite;
            text-decoration: none;
            background: var(--glass-bg);
            border: 1px solid rgba(255,0,0,0.45);
            transition: transform .12s ease, background .12s ease, box-shadow .12s ease, color .12s ease;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.4px;
        }
        .link-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(255,0,0,0.45);
            background: rgba(255,0,0,0.2);
            color: var(--accent);
        }
        .link-btn i {
            font-size: 16px;
        }
        @media (max-width:520px){
            h1 { font-size: 28px; }
            .card { padding: 20px; }
            .link-btn { padding: 8px 14px; font-size:13px; }
        }
    </style>
</head>
<body>
    <canvas id="netCanvas" aria-hidden="true"></canvas>

    <main class="overlay" role="main">
        <section class="card" aria-labelledby="title">
            <h1 id="title" style="color: antiquewhite;">TONY</h1>
            <p class="lead" id="nowTime"></p>

            <div class="links" aria-label="社群連結">
                <a class="link-btn" href="https://github.com/TONYWU115" target="_blank" rel="noopener" aria-label="GitHub">
                    <i class="fa-brands fa-github"></i>
                    <span>GitHub</span>
                </a>

                <a class="link-btn" href="https://www.instagram.com/yan.93.01/" target="_blank" rel="noopener" aria-label="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                    <span>Instagram</span>
                </a>

                <a class="link-btn" href="https://x.com/ttoonnyy115" target="_blank" rel="noopener" aria-label="X">
                    <i class="fa-brands fa-x-twitter"></i>
                    <span>X</span>
                </a>

                <!-- <a class="link-btn" href="https://www.linkedin.com/" target="_blank" rel="noopener" aria-label="LinkedIn">
                <i class="fa-brands fa-linkedin"></i>
                <span>LinkedIn</span>
                </a> -->

                <!-- <a class="link-btn" href="https://steamcommunity.com/id/ttoonnyy115" target="_blank" rel="noopener" aria-label="Steam">
                    <i class="fa-brands fa-steam"></i>
                    <span>Steam</span>
                </a> -->

            </div>
        </section>
    </main>

    <script>
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleString('zh-TW', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('nowTime').textContent = timeStr;
        }
        updateTime();
        setInterval(updateTime, 1000);

        const canvas = document.getElementById("netCanvas");
        const ctx = canvas.getContext("2d");
        const numPoints = 20;  // 橫向與縱向的點數
        const points = [];
        const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            resetPoints();
        }

        class Point {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.originX = x;
                this.originY = y;
                this.size = 3;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255,80,80,0.95)";
                ctx.fill();
            }
            update() {
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.max(1, Math.sqrt(dx * dx + dy * dy));
                const force = Math.min(220 / dist, 8);
                const angle = Math.atan2(dy, dx);
                this.x += Math.cos(angle) * force;
                this.y += Math.sin(angle) * force;
                this.x += (this.originX - this.x) * 0.05;
                this.y += (this.originY - this.y) * 0.05;
                this.draw();
            }
        }

        function resetPoints() {
            points.length = 0;
            const stepX = window.innerWidth / (numPoints + 1);
            const stepY = window.innerHeight / (numPoints + 1);
            for (let i = 1; i <= numPoints; i++) {
                for (let j = 1; j <= numPoints; j++) {
                    const x = i * stepX;
                    const y = j * stepY;
                    points.push(new Point(x, y));
                }
            }
        }

        function connectPoints() {
            ctx.strokeStyle = "rgba(255,80,80,0.6)";
            ctx.lineWidth = 1;
            for (let i = 0; i < points.length; i++) {
                for (let j = i + 1; j < points.length; j++) {
                    const dx = points[i].x - points[j].x;
                    const dy = points[i].y - points[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 100) {
                        ctx.beginPath();
                        ctx.moveTo(points[i].x, points[i].y);
                        ctx.lineTo(points[j].x, points[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            points.forEach((point) => point.update());
            connectPoints();
            requestAnimationFrame(animate);
        }

        window.addEventListener("mousemove", (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener("touchmove", (e) => {
            if (e.touches && e.touches[0]) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        }, {passive:true});

        function explode() {
            points.forEach((point) => {
                point.x += Math.random() * 50 - 25;
                point.y += Math.random() * 50 - 25;
            });
        }
        window.addEventListener("click", (e) => {
            if (e.target && e.target.closest && e.target.closest('.link-btn')) return;
            explode();
        });
        window.addEventListener("touchstart", (e) => {
            const target = e.target;
            if (target && target.closest && target.closest('.link-btn')) return;
            explode();
        }, { passive: true });

        window.addEventListener("resize", resizeCanvas);

        resizeCanvas();
        animate();
    </script>
</body>
</html>
